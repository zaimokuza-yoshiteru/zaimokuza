0.0" y="315" text-anchor="middle" font-size="16" fill="#666d5f">调用与结果一起保留</text><path d="M694 161Q807.5 157 922 160L926 306Q807.5 312 691 309Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M692 164L920 162L923 311L694 307" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="807.5" y="190" text-anchor="middle" font-size="21">下一次上下文</text><text x="807.5" y="220" text-anchor="middle" font-size="16" fill="#666d5f">稳定指令</text><text x="807.5" y="245" text-anchor="middle" font-size="16" fill="#666d5f">已提交摘要 + 近期轮次</text><text x="807.5" y="270" text-anchor="middle" font-size="16" fill="#666d5f">本轮输入</text><path d="M282 170Q317.5 160.0 353 160" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="317.5" y="150.0" text-anchor="middle" font-size="15">总结</text><path d="M282 246Q317.5 267.0 353 298" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="317.5" y="257.0" text-anchor="middle" font-size="15">保留</text><path d="M586 164Q635.0 186.0 684 218" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M586 298Q635.0 275.5 684 263" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 222Q480 230 580 220" stroke="#ac7966" fill="none" stroke-width="2"/><text x="480" y="396" text-anchor="middle" font-size="19">摘要成功、校验通过，再替换视图；失败时仍能沿用旧状态。</text></g></svg>
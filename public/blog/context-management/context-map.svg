<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img"><title>草图 01 · 模型究竟看见什么？</title><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9cfbb" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L10 5L1 9" fill="none" stroke="#626c59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="430" fill="#f8f3ea"/><rect width="960" height="430" fill="url(#paper)"/><g font-family="Kaiti SC, STKaiti, KaiTi, serif" fill="#343c36"><text x="36" y="47" font-size="25">草图 01 · 模型究竟看见什么？</text><text x="36" y="78" font-size="15" fill="#737569">先区分存储、装配和请求，后面的问题才不会混在一起。</text><path d="M39 125Q157.5 121 277 124L281 215Q157.5 221 36 218Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M37 128L275 126L278 220L39 216" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="157.5" y="154" text-anchor="middle" font-size="21">磁盘：历史与文件</text><text x="157.5" y="184" text-anchor="middle" font-size="16" fill="#666d5f">保存过 ≠ 本次带上</text><path d="M39 267Q157.5 263 277 266L281 357Q157.5 363 36 360Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M37 270L275 268L278 362L39 358" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="157.5" y="296" text-anchor="middle" font-size="21">记忆 / 检索入口</text><text x="157.5" y="326" text-anchor="middle" font-size="16" fill="#666d5f">找到后，也要显式装配</text><path d="M384 147Q487.5 143 592 146L596 317Q487.5 323 381 320Z" fill="#e4e9d9" stroke="#6d705e" stroke-width="1.7"/><path d="M382 150L590 148L593 322L384 318" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="487.5" y="176" text-anchor="middle" font-size="21">上下文装配器</text><text x="487.5" y="206" text-anchor="middle" font-size="16" fill="#666d5f">稳定指令 + 工具定义</text><text x="487.5" y="231" text-anchor="middle" font-size="16" fill="#666d5f">摘要 + 近期完整轮次</text><text x="487.5" y="256" text-anchor="middle" font-size="16" fill="#666d5f">本轮输入 + 选中证据</text><path d="M704 168Q810.0 164 917 167L921 296Q810.0 302 701 299Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M702 171L915 169L918 301L704 297" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="810.0" y="197" text-anchor="middle" font-size="21">本次模型请求</text><text x="810.0" y="227" text-anchor="middle" font-size="16" fill="#666d5f">窗口有限</text><text x="810.0" y="252" text-anchor="middle" font-size="16" fill="#666d5f">只能看见已提交的内容</text><path d="M285 167Q329.5 178.5 374 200" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="329.5" y="168.5" text-anchor="middle" font-size="15">选择</text><path d="M285 310Q329.5 283.5 374 267" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="329.5" y="273.5" text-anchor="middle" font-size="15">召回</text><path d="M602 225Q648.0 220.0 694 225" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="648.0" y="210.0" text-anchor="middle" font-size="15">预算检查</text><text x="480" y="400" text-anchor="middle" font-size="19">一个 Agent 的上下文，是一次请求的视图，不是整个工作区。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img"><title>草图 03 · 从“记得有这件事”到“拿回原文”</title><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9cfbb" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L10 5L1 9" fill="none" stroke="#626c59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="430" fill="#f8f3ea"/><rect width="960" height="430" fill="url(#paper)"/><g font-family="Kaiti SC, STKaiti, KaiTi, serif" fill="#343c36"><text x="36" y="47" font-size="25">草图 03 · 从“记得有这件事”到“拿回原文”</text><text x="36" y="78" font-size="15" fill="#737569">关键词检索、向量检索和历史分页，是不同的恢复路径。</text><path d="M34 156Q122.5 152 212 155L216 276Q122.5 282 31 279Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M32 159L210 157L213 281L34 277" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="122.5" y="185" text-anchor="middle" font-size="21">原文 / 记忆库</text><text x="122.5" y="215" text-anchor="middle" font-size="16" fill="#666d5f">记录 ID</text><text x="122.5" y="240" text-anchor="middle" font-size="16" fill="#666d5f">内容 + 访问范围</text><path d="M296 114Q387.0 110 479 113L483 214Q387.0 220 293 217Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M294 117L477 115L480 219L296 215" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="387.0" y="143" text-anchor="middle" font-size="21">关键词 / FTS</text><text x="387.0" y="173" text-anchor="middle" font-size="16" fill="#666d5f">定位错误码、名称</text><path d="M296 264Q387.0 260 479 263L483 364Q387.0 370 293 367Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M294 267L477 265L480 369L296 365" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="387.0" y="293" text-anchor="middle" font-size="21">向量检索（可选）</text><text x="387.0" y="323" text-anchor="middle" font-size="16" fill="#666d5f">召回意思相近的片段</text><path d="M569 161Q642.5 157 717 160L721 302Q642.5 308 566 305Z" fill="#e4e9d9" stroke="#6d705e" stroke-width="1.7"/><path d="M567 164L715 162L718 307L569 303" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="642.5" y="190" text-anchor="middle" font-size="21">筛选与排序</text><text x="642.5" y="220" text-anchor="middle" font-size="16" fill="#666d5f">权限 / 相关性</text><text x="642.5" y="245" text-anchor="middle" font-size="16" fill="#666d5f">去重 / 多样性</text><text x="642.5" y="270" text-anchor="middle" font-size="16" fill="#666d5f">新旧与预算</text><path d="M795 179Q860.5 175 927 178L931 286Q860.5 292 792 289Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M793 182L925 180L928 291L795 287" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="860.5" y="208" text-anchor="middle" font-size="21">模型上下文</text><text x="860.5" y="238" text-anchor="middle" font-size="16" fill="#666d5f">少量证据</text><text x="860.5" y="263" text-anchor="middle" font-size="16" fill="#666d5f">可回读 ID</text><path d="M221 187Q253.5 171.0 286 165" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M221 250Q253.5 274.0 286 308" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M488 164Q523.5 179.0 559 204" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M488 311Q523.5 284.5 559 268" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M726 231Q755.5 226.0 785 231" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="411" text-anchor="middle" font-size="18">“找到了”只是中间步骤；读回原文并放进请求，模型才真正获得证据。</text></g></svg>
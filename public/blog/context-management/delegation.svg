<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img"><title>草图 04 · 协作不是共享一块上下文白板</title><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d9cfbb" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L10 5L1 9" fill="none" stroke="#626c59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="430" fill="#f8f3ea"/><rect width="960" height="430" fill="url(#paper)"/><g font-family="Kaiti SC, STKaiti, KaiTi, serif" fill="#343c36"><text x="36" y="47" font-size="25">草图 04 · 协作不是共享一块上下文白板</text><text x="36" y="78" font-size="15" fill="#737569">继承哪些消息，与允许使用哪些工具，需要分别决定。</text><path d="M39 137Q157.5 133 277 136L281 292Q157.5 298 36 295Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M37 140L275 138L278 297L39 293" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="157.5" y="166" text-anchor="middle" font-size="21">父 Agent</text><text x="157.5" y="196" text-anchor="middle" font-size="16" fill="#666d5f">完整任务与已完成历史</text><text x="157.5" y="221" text-anchor="middle" font-size="16" fill="#666d5f">自己的上下文窗口</text><text x="157.5" y="246" text-anchor="middle" font-size="16" fill="#666d5f">自己的权限</text><path d="M367 165Q474.0 161 582 164L586 276Q474.0 282 364 279Z" fill="#e4e9d9" stroke="#6d705e" stroke-width="1.7"/><path d="M365 168L580 166L583 281L367 277" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="474.0" y="194" text-anchor="middle" font-size="21">显式交接</text><text x="474.0" y="224" text-anchor="middle" font-size="16" fill="#666d5f">fresh：任务 + 必要资料</text><text x="474.0" y="249" text-anchor="middle" font-size="16" fill="#666d5f">fork：选定历史快照</text><path d="M680 137Q798.5 133 918 136L922 292Q798.5 298 677 295Z" fill="#eee8d9" stroke="#6d705e" stroke-width="1.7"/><path d="M678 140L916 138L919 297L680 293" fill="none" stroke="#6d705e" stroke-width=".6" opacity=".45"/><text x="798.5" y="166" text-anchor="middle" font-size="21">子 Agent</text><text x="798.5" y="196" text-anchor="middle" font-size="16" fill="#666d5f">独立消息与工具轨迹</text><text x="798.5" y="221" text-anchor="middle" font-size="16" fill="#666d5f">自己的上下文窗口</text><text x="798.5" y="246" text-anchor="middle" font-size="16" fill="#666d5f">单独约束的权限</text><path d="M285 204Q320.5 199.0 356 204" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M591 204Q630.5 199.0 670 204" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><path d="M798 303Q786 366 483 348Q190 362 158 303" fill="none" stroke="#626c59" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="337" text-anchor="middle" font-size="18">返回结论、证据和必要的产物引用</text><text x="480" y="401" text-anchor="middle" font-size="18">文件系统可以共享；消息上下文不会因此自动共享。</text></g></svg>